<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Личный учёт 2026</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDEEEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C2321" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Учёт">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>
<style>
  :root{
    --ground:#EDEEEA; --card:#FAFAF8; --ink:#1C2321; --muted:#6E7873;
    --line:#D3D6CF; --mal:#176B54; --cop:#B25B2A; --blue:#4A6FA5; --kat:#93AECC; --gold:#8A7A2E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;padding:14px 12px 48px}
  .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .card{background:#fff;border:none;border-radius:7px;padding:15px 14px;margin-bottom:11px;
    box-shadow:0 1px 2px rgba(28,35,33,.07),0 2px 10px rgba(28,35,33,.045)}
  input{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:15px;
    color:var(--ink);text-align:right;padding:9px 10px;border:1px solid var(--line);border-radius:3px;
    background:#fff;width:126px}
  input:focus{outline:2px solid var(--mal);outline-offset:1px}
  button{font-family:inherit;cursor:pointer}
  table{width:100%;border-collapse:collapse}
  .hd{display:flex;justify-content:space-between;align-items:baseline}
  .row{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .kpi{background:#fff;border:none;border-radius:7px;padding:13px 12px;
    box-shadow:0 1px 2px rgba(28,35,33,.07),0 2px 10px rgba(28,35,33,.045)}
  .chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:10px}
  .chip{flex:0 0 auto;padding:6px 11px;font-size:12px;border-radius:3px;border:1px solid var(--line);
    background:transparent;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .chip.has{background:#fff;color:var(--ink)}
  .chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:600}
  .tab{flex:0 0 auto;padding:9px 11px;background:none;border:none;border-bottom:2px solid transparent;
    color:var(--muted);font-size:11px;letter-spacing:-.02em;white-space:nowrap}
  .tab.on{border-bottom-color:var(--mal);color:var(--ink);font-weight:600}
  .lg{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:var(--muted)}
  .lg span{display:flex;align-items:center;gap:5px}
  .sw{width:8px;height:8px;border-radius:1px;display:inline-block}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{
    body{background:#fff;padding:0;font-size:11px}
    nav,button,input{display:none!important}
    .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;page-break-inside:avoid;margin-bottom:8px}
    .chips{display:none}
  }

  /* --- айфон --- */
  @media (pointer:coarse){
    input,select,textarea{font-size:16px!important}
  }
  body{padding:calc(14px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
       calc(48px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
       -webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
  @media (display-mode:standalone){
    body{padding-top:calc(6px + env(safe-area-inset-top))}
  }
</style>
<div id="app">Загружаю…</div>
<script>
const YEARS_SEED={};
const BROKER={src:"",y:{},y26:0,top25:[]};
const MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const SHORT=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
const FIELDS=[["bank","Банк %"],["div","Дивиденды с БР"],["salary","Зарплата"],["katya","Партнёр ПИ"],["pi","ПИ"],["other","Иное"]];
const CURRENCY={};
const CUR_COLOR={"RUB":"#176B54","USD / AED / EUR":"#4A6FA5","USD":"#93AECC","HKD":"#B25B2A","USD (BTC/ETH)":"#8A7A2E"};
const DEBTS=[["d1","Кредит 1"],["d2","Кредит 2"],["d3","Прочие обязательства"]];
const INFO_DEBTS=[];
const DATES=["31.12.2025","01.02.2026","01.03.2026","01.04.2026","01.05.2026","01.06.2026","01.07.2026","01.08.2026","01.09.2026","01.10.2026","01.11.2026","01.12.2026","31.12.2026"];
const ACCOUNTS=[
 ["a1","—","Брокерский 1","Брокерские",[]],
 ["a2","—","Брокерский 2","Брокерские",[]],
 ["a3","—","ИИС","Брокерские",[]],
 ["a4","—","Брокерский 3","Брокерские",[]],
 ["a23","—","ИИС 2","Брокерские",[]],
 ["a6","—","Брокерский 4","Брокерские",[]],
 ["a7","—","Брокерский 5","Брокерские",[]],
 ["a8","—","Брокерский 6","Брокерские",[]],
 ["a9","—","Брокерский 7","Брокерские",[]],
 ["a10","—","Зарубежный брокер","Брокерские",[]],
 ["a11","—","Вклад 1","Вклады",[]],
 ["a17","—","Вклад 2","Вклады",[]],
 ["a18","—","Вклад 3","Вклады",[]],
 ["a12","—","Кошелёк 1","Крипта",[]],
 ["a13","—","Кошелёк 2","Крипта",[]],
 ["a14","—","Кошелёк 3","Крипта",[]],
 ["a16","—","Кошелёк 4","Крипта",[]],
 ["a19","—","Счёт ребёнка","Ребёнок",[]],
 ["a22","—","Иное","Прочее",[]]];
const RENO_ACC=["a17","a18"];
const GROUPS=["Брокерские","Вклады","Крипта","Ребёнок","Прочее"];
const GC={"Брокерские":"#176B54","Вклады":"#8A7A2E","Крипта":"#B25B2A","Ребёнок":"#4A6FA5","Прочее":"#6E7873"};
const LEVELS=[["КОМФОРТ",250000],["КОМФОРТ +",350000],["БИЗНЕС",500000],["БИЗНЕС +",700000],["LUXURY",1000000]];
const SEED_INCOME={};

const fmt=n=>(n||n===0)?Math.round(n).toLocaleString("ru-RU"):"—";
const num=s=>{const v=parseInt(String(s).replace(/[^\d]/g,""),10);return isNaN(v)?0:v};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let S={income:JSON.parse(JSON.stringify(SEED_INCOME)),capital:{}};
DATES.forEach(d=>S.capital[d]={});
ACCOUNTS.forEach(a=>a[4].forEach((v,i)=>{if(v!==null)S.capital[DATES[i]][a[0]]=v*1000}));
S.goal=100000;
S.debts={"01.08.2026":{d1:4765914}};
S.goals={a1:2800000,a6:1600000}; S.iis={dep:300000}; S.ops=[]; S.years=JSON.parse(JSON.stringify(YEARS_SEED));
let V={tab:"obzor",month:"Август",date:"01.08.2026"};

const PATCH_V=10;
const PATCH={capital:{},debts:{},goals:{},iis:{dep:0},bank:{},div:{},wd:{},years:{}};
function applyPatch(){
  Object.entries(PATCH.capital).forEach(([d,m])=>{S.capital[d]=S.capital[d]||{};
    Object.entries(m).forEach(([k,v])=>{S.capital[d][k]=v});});
  Object.entries(PATCH.debts).forEach(([d,m])=>{S.debts[d]=Object.assign({},m,S.debts[d]||{})});
  Object.entries(PATCH.goals).forEach(([k,v])=>{if(!S.goals[k])S.goals[k]=v});
  if(!num(S.iis&&S.iis.dep))S.iis={dep:PATCH.iis.dep};
  S.years=S.years||{};
  Object.entries(PATCH.years).forEach(([y,m])=>{S.years[y]=S.years[y]||{};
    Object.entries(m).forEach(([k,v])=>{if(!num(S.years[y][k]))S.years[y][k]=v;});});
  Object.entries(PATCH.wd).forEach(([m,v])=>{S.income[m]=S.income[m]||{}; S.income[m].wd=v});
  Object.entries(PATCH.div).forEach(([m,v])=>{S.income[m]=S.income[m]||{}; S.income[m].div=v});
  Object.entries(PATCH.bank).forEach(([m,v])=>{S.income[m]=S.income[m]||{}; S.income[m].bank=v});
  S.patch=PATCH_V;
}
const KEY="uchet-2026";
async function load(){
  try{const t=localStorage.getItem(KEY);
    if(t){const d=JSON.parse(t);
      if(d.income)S.income=d.income; if(d.capital)S.capital=d.capital; if(d.goal)S.goal=d.goal; if(d.debts)S.debts=d.debts; if(d.goals)S.goals=d.goals; if(d.iis)S.iis=d.iis; if(d.ops)S.ops=d.ops; if(d.years)S.years=d.years; if(d.names){S.names=d.names;applyNames();}
      if((d.patch||0)<PATCH_V){applyPatch();save();}
      return;}}catch(e){}
  try{const r=await window.storage.get(KEY);const d=JSON.parse(r.value);
    if(d.income)S.income=d.income; if(d.capital)S.capital=d.capital; if(d.goal)S.goal=d.goal; if(d.debts)S.debts=d.debts; if(d.goals)S.goals=d.goals; if(d.iis)S.iis=d.iis; if(d.ops)S.ops=d.ops; if(d.years)S.years=d.years; if(d.names){S.names=d.names;applyNames();}
    if((d.patch||0)<PATCH_V){applyPatch();save();}
    return;}catch(e){}
  applyPatch();
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const t=JSON.stringify(S); let ok=false;
    try{localStorage.setItem(KEY,t); ok=true;}catch(e){}
    try{await window.storage.set(KEY,t); ok=true;}catch(e){}
    if(ok)flash(); else warn();
  },400);
}
function warn(){const el=document.getElementById("saved");if(!el)return;
  el.textContent="НЕ СОХРАНЕНО";el.style.color="var(--cop)";}
function flash(){const el=document.getElementById("saved");if(!el)return;
  el.textContent="сохранено";el.style.color="var(--mal)";setTimeout(()=>{el.style.color="transparent"},1500);}

function applyNames(){
  if(!S.names)return;
  ACCOUNTS.forEach(a=>{const n=S.names[a[0]];
    if(n&&n.length>=2){a[1]=n[0];a[2]=n[1];}});
}
function nameMap(){return Object.fromEntries(ACCOUNTS.map(a=>[a[0],[a[1],a[2]]]))}
function impErr(t){const m=document.getElementById("impmsg");
  if(m){m.textContent=t;m.style.color="var(--cop)";}}
function applyImport(text){
  let d; try{d=JSON.parse(text);}catch(e){return false;}
  if(!d||typeof d!=="object"||!d.income||!d.capital)return false;
  S.income=d.income; S.capital=d.capital;
  if(d.goal)S.goal=d.goal;
  S.debts=d.debts||{}; S.goals=d.goals||{};
  S.iis=d.iis||{}; S.ops=d.ops||[]; S.years=d.years||JSON.parse(JSON.stringify(YEARS_SEED));
  S.patch=d.patch||0;
  if(d.names)S.names=d.names;
  applyNames();
  if((S.patch||0)<PATCH_V)applyPatch();
  save(); render();
  const m=document.getElementById("impmsg");
  if(m){m.textContent="Данные загружены.";m.style.color="var(--mal)";}
  return true;
}

function mrow(m){const v=S.income[m]||{};
  const p=num(v.bank)+num(v.div),sal=num(v.salary),kat=num(v.katya),e=num(v.pi)+num(v.other);
  const hasW=v.wd!==undefined&&v.wd!=="",wd=hasW?Math.min(num(v.wd),p):p,reinv=hasW?p-wd:0;
  return{m,p,sal,kat,a:sal+kat,e,wd,reinv,hasW,t:p+sal+kat+e};}
const rows=()=>MONTHS.map(mrow);
const capSum=d=>ACCOUNTS.reduce((s,a)=>s+num((S.capital[d]||{})[a[0]]),0);
const dToIso=d=>{const p=d.split(".");return p[2]+"-"+p[1]+"-"+p[0];};
function periodOps(fromD,toD){
  const fi=dToIso(fromD),ti=dToIso(toD);
  return (S.ops||[]).filter(o=>o.d>=fi&&o.d<=ti);
}
function acctFlow(id,ops){
  let flow=0,inc=0;
  ops.forEach(o=>{
    const s=num(o.s);
    if(o.k==="inc"){if(o.a===id)inc+=s;return;}
    if(o.k==="dep"||o.k==="one"){if(o.a===id)flow+=s;return;}
    if(o.k==="wdr"||o.k==="exp"){if(o.a===id)flow-=s;return;}
    if(o.k==="mov"){if(o.a===id)flow-=s;if(o.t===id)flow+=s;return;}
  });
  return{flow,inc};
}
function liveReturns(){
  const filled=DATES.filter(d=>capSum(d)>0);
  if(filled.length<2)return{L:[],from:"",to:"",skipped:[]};
  const from=filled[0],to=filled[filled.length-1];
  const ops=periodOps(from,to);
  const L=[],skipped=[];
  ACCOUNTS.forEach(a=>{
    const id=a[0];
    const v0=num((S.capital[from]||{})[id]),v1=num((S.capital[to]||{})[id]);
    if(!v0&&!v1)return;
    if(!v0){skipped.push([a[2],"счёт открыт в этом периоде"]);return;}
    if(!v1){skipped.push([a[2],"счёт закрыт/обнулён к "+to]);return;}
    const{flow,inc}=acctFlow(id,ops);
    const r=Math.round(((v1-v0-flow)/v0*100)*10)/10;
    L.push({k:id,n:a[2],v0,v1,dep:flow,inc,r});
  });
  return{L,from,to,skipped};
}

function stats(){
  const R=rows(),f=R.filter(r=>r.t>0);
  const ytd=f.reduce((s,r)=>s+r.t,0),yp=f.reduce((s,r)=>s+r.p,0);
  const ysal=f.reduce((s,r)=>s+r.sal,0),ykat=f.reduce((s,r)=>s+r.kat,0);
  const ywd=f.reduce((s,r)=>s+r.wd,0),yreinv=f.reduce((s,r)=>s+r.reinv,0);
  const anyW=f.some(r=>r.hasW),budget=ytd-yreinv;
  const ex=MONTHS.map(m=>num((S.income[m]||{}).exp)).filter(v=>v>0);
  const yexp=ex.reduce((a,b)=>a+b,0),avgExp=ex.length?yexp/ex.length:0;
  const rn=MONTHS.map(m=>num((S.income[m]||{}).reno)).filter(v=>v>0);
  const yreno=rn.reduce((a,b)=>a+b,0);
  let renoEst=0;
  RENO_ACC.forEach(id=>{const v=DATES.map(d=>(S.capital[d]||{})[id]).filter(x=>x!==undefined&&x!==null);
    for(let i=1;i<v.length;i++)renoEst+=Math.max(0,v[i-1]-v[i]);});
  const dt=DATES.map(d=>({d,t:capSum(d)})),wd=dt.filter(x=>x.t>0);
  const now=wd.length?wd[wd.length-1]:{d:"—",t:0};
  return{R,f,ytd,yp,ysal,ykat,ywd,yreinv,anyW,budget,avgBudget:f.length?budget/f.length:0,yexp,avgExp,nexp:ex.length,yreno,nreno:rn.length,renoEst,avg:f.length?ytd/f.length:0,avgP:f.length?yp/f.length:0,dt,wd,now,delta:now.t-dt[0].t};
}

function barChart(R){
  const W=340,H=150,pad=16,bw=(W-pad)/12,max=Math.max(...R.map(r=>r.t),1);
  let s=`<svg viewBox="0 0 ${W} ${H+18}" style="width:100%;height:auto">`;
  for(let i=0;i<=3;i++){const y=H-(H-10)*i/3;
    s+=`<line x1="${pad}" y1="${y}" x2="${W}" y2="${y}" stroke="#D3D6CF" stroke-width="1"/>`;
    s+=`<text x="0" y="${y+3}" font-size="8" fill="#6E7873">${Math.round(max*i/3/1000)}</text>`;}
  R.forEach((r,i)=>{
    const x=pad+i*bw+2,w=bw-4;let y=H;
    [[r.p,"#176B54"],[r.sal,"#4A6FA5"],[r.kat,"#93AECC"],[r.e,"#B25B2A"]].forEach(([v,c])=>{
      const h=(H-10)*v/max;y-=h;
      if(h>0)s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;});
    s+=`<text x="${x+w/2}" y="${H+12}" font-size="8" fill="#6E7873" text-anchor="middle">${SHORT[i]}</text>`;});
  return s+"</svg>";
}
function lineChart(wd,alt){
  const W=340,H=130,pad=22;
  if(wd.length<2)return`<div style="font-size:11px;color:var(--muted);padding:16px 0">Нужно минимум два среза капитала.</div>`;
  const all=wd.map(x=>x.t).concat(alt||[]);
  const mn=Math.min(...all)*0.995,mx=Math.max(...all)*1.005;
  const X=i=>pad+(W-pad-6)*i/(wd.length-1),Y=v=>H-8-(H-24)*(v-mn)/(mx-mn||1);
  let s=`<svg viewBox="0 0 ${W} ${H+16}" style="width:100%;height:auto">`;
  for(let i=0;i<=2;i++){const v=mn+(mx-mn)*i/2,y=Y(v);
    s+=`<line x1="${pad}" y1="${y}" x2="${W}" y2="${y}" stroke="#D3D6CF"/>`;
    s+=`<text x="0" y="${y+3}" font-size="8" fill="#6E7873">${(v/1e6).toFixed(1)}</text>`;}
  s+=`<polygon fill="#176B54" fill-opacity="0.09" points="${X(0)},${H-8} ${wd.map((x,i)=>X(i)+","+Y(x.t)).join(" ")} ${X(wd.length-1)},${H-8}"/>`;
  s+=`<polyline fill="none" stroke="#176B54" stroke-width="2" points="${wd.map((x,i)=>X(i)+","+Y(x.t)).join(" ")}"/>`;
  if(alt&&alt.length===wd.length)
    s+=`<polyline fill="none" stroke="#6E7873" stroke-width="1.6" stroke-dasharray="4 3" points="${alt.map((v,i)=>X(i)+","+Y(v)).join(" ")}"/>`;
  wd.forEach((x,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(x.t)}" r="3" fill="#176B54"/>`;
    s+=`<text x="${X(i)}" y="${H+12}" font-size="8" fill="#6E7873" text-anchor="middle">${x.d.slice(0,5)}</text>`;});
  return s+"</svg>";
}
function scale(avg,avgP,budgetMode){
  const mx=1100000,p=v=>Math.min(100,v/mx*100);
  let t=`<div style="position:relative;padding:34px 0 92px">
    <div style="position:absolute;left:${p(avg)}%;top:0;transform:translateX(-50%);white-space:nowrap">
      <div class="mono" style="font-size:14px;font-weight:700;text-align:center;letter-spacing:-.02em">${fmt(avg)}</div>
      <div style="font-size:8px;color:var(--muted);text-align:center;letter-spacing:.06em">₽ / МЕС</div>
      <div style="width:1px;height:8px;background:var(--ink);margin:2px auto 0"></div></div>
    <div style="position:relative;height:10px;background:#fff;border:1px solid var(--line)">
      <div style="position:absolute;inset:0 auto 0 0;width:${p(avg)}%;background:var(--ink)"></div>
      <div style="position:absolute;inset:0 auto 0 0;width:${p(avgP)}%;background:var(--mal)"></div>`;
  LEVELS.forEach(([,m])=>{t+=`<div style="position:absolute;left:${p(m)}%;top:-3px;bottom:-3px;width:1px;background:var(--muted)"></div>`});
  t+=`</div>`;
  LEVELS.forEach(([n,m],i)=>{
    const sh=i===0?"-32%":i===4?"-68%":"-50%";
    t+=`<div style="position:absolute;left:${p(m)}%;top:${i%2?66:42}px;transform:translateX(${sh});text-align:center">
      <div style="font-size:8px;letter-spacing:.06em;white-space:nowrap;color:${avg>=m?"var(--ink)":"var(--muted)"};font-weight:${avg>=m?700:400}">${n}</div>
      <div class="mono" style="font-size:8px;color:var(--muted)">${m/1000}к</div></div>`;});
  t+=`</div><div class="lg" style="flex-direction:column;gap:4px;align-items:flex-start">
    <span><i class="sw" style="background:var(--ink)"></i>${budgetMode?"всего дошло до бюджета":"весь доход"} — <b class="mono" style="color:var(--ink)">${fmt(avg)} ₽/мес</b></span>
    <span><i class="sw" style="background:var(--mal)"></i>${budgetMode?"из них с брокерских счетов на карту":"из них пассивный доход"} — <b class="mono" style="color:var(--ink)">${fmt(avgP)} ₽/мес</b></span></div>`;
  return t;
}
function structure(d){
  const tot=capSum(d)||1;let b="",l="";
  GROUPS.forEach(g=>{const v=ACCOUNTS.filter(a=>a[3]===g).reduce((s,a)=>s+num((S.capital[d]||{})[a[0]]),0);
    b+=`<div style="width:${v/tot*100}%;background:${GC[g]}"></div>`;
    l+=`<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;color:var(--muted)">

      <span class="mono" style="color:var(--ink)">${fmt(v)} · ${Math.round(v/tot*100)}%</span></div>`;});
  return`<div style="margin-top:16px"><div style="display:flex;height:8px;margin-bottom:10px">${b}</div>${l}</div>`;
}

function years(cap,req,r,c){
  if(r<=0||cap>=req)return cap>=req?0:null;
  const a=req*r+c,b=cap*r+c;
  if(a<=0||b<=0)return null;
  const n=Math.log(a/b)/Math.log(1+r);
  return(n>0&&n<80)?n:null;}

function fiCard(st){
  const cap=st.now.t,passMo=st.avgP,yield_=cap?passMo*12/cap:0;
  const tg=S.goal,cov=tg?passMo/tg:0;
  const req=yield_>0?tg*12/yield_:0,gap=req-cap;
  const n=st.f.length||1,reno=st.nreno?st.yreno:st.renoEst;
  const impliedExp=Math.max(0,(st.ytd-st.delta-reno)/n);
  const exp=st.avgExp||impliedExp;
  const sav=(st.avg-exp)*12;
  const yrs=years(cap,req,yield_,sav);
  const opts=[["по моим расходам",Math.round(exp)]].concat(LEVELS.map(l=>[l[0]+" · "+l[1]/1000+"к",l[1]]))
    .map(([n,v])=>`<option value="${v}" ${v==tg?"selected":""}>${n}</option>`).join("");
  return `<div class="card"><div class="eyebrow">Финансовая независимость</div>
    <div style="display:flex;align-items:center;gap:8px;margin:8px 0 14px">
      <span style="font-size:11px;color:var(--muted)">цель</span>
      <select id="goal" style="flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:#fff;font-size:12px;font-family:inherit;color:var(--ink)">${opts}</select></div>
    <div style="position:relative;height:12px;background:#fff;border:1px solid var(--line);margin-bottom:6px">
      <div style="position:absolute;inset:0 auto 0 0;width:${Math.min(100,cov*100)}%;background:var(--mal)"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:14px">
      <span>пассив <b class="mono" style="color:var(--ink)">${fmt(passMo)} ₽/мес</b></span>
      <span><b class="mono" style="color:var(--mal)">${Math.round(cov*100)}%</b> от цели ${fmt(tg)} ₽</span></div>
    ${fl("Доходность портфеля",(yield_*100).toFixed(1).replace(".",",")+"% годовых")}
    ${fl("Нужен капитал",fmt(req)+" ₽")}
    ${fl("Не хватает",fmt(gap)+" ₽","var(--cop)")}
    ${fl("Накопления в год",(sav>=0?"":"−")+fmt(Math.abs(sav))+" ₽",sav>=0?"var(--mal)":"var(--cop)")}
    ${fl("До цели",yrs===null?"не достигается при текущем темпе":yrs.toFixed(1).replace(".",",")+" лет",yrs===null?"var(--cop)":"var(--ink)")}
    <div style="font-size:10px;color:var(--muted);margin-top:10px;line-height:1.4">Доходность считается от фактического пассивного дохода за ${st.f.length} мес. к текущему капиталу.${st.avgExp?"":" Регулярные расходы взяты расчётно: отток за вычетом ремонта ("+fmt(reno)+" ₽)."}</div>
    <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px">
      <div class="eyebrow" style="margin-bottom:2px">Дорожная карта по уровням</div>
      ${LEVELS.map(([name,lvl])=>{
        const reqL=yield_>0?lvl*12/yield_:0, reached=cap>=reqL;
        const yrsL=reached?0:years(cap,reqL,yield_,sav);
        const when=(yrsL!==null&&yrsL>0)?new Date(Date.now()+yrsL*365.25*86400000).toLocaleDateString("ru-RU",{month:"short",year:"numeric"}):"";
        const label=reached?"✓ достигнуто":yrsL===null?"не достигается":yrsL.toFixed(1).replace(".",",")+" лет"+(when?" · "+when:"");
        const color=reached?"var(--mal)":yrsL===null?"var(--cop)":"var(--ink)";
        return `<div style="display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-top:1px solid var(--line)">
          <span style="font-size:12px">${name} <span class="mono" style="color:var(--muted);font-size:10px">${fmt(lvl)} ₽/мес</span></span>
          <span class="mono" style="font-size:12px;font-weight:600;color:${color}">${label}</span></div>`;
      }).join("")}
      <div style="font-size:10px;color:var(--muted);margin-top:8px;line-height:1.4">Та же формула, что и выше, сразу для каждого уровня жизни — при текущей доходности портфеля и годовых накоплениях. Разовые поступления (вроде майских 800 000 ₽) и смена доходности расчёт не учитывает.</div></div></div>`;
}
function flowCard(st){
  const tot=st.yp||1,w=st.ywd/tot*100;
  return `<div class="card"><div class="eyebrow">Пассивный доход: куда он идёт</div>
    <div style="font-size:11px;color:var(--muted);margin:4px 0 12px">${st.anyW?"по внесённым данным":"не заполнено — весь доход считается выведенным"}</div>
    <div style="display:flex;height:12px;margin-bottom:6px;border:1px solid var(--line);background:#fff">
      <div style="width:${w}%;background:var(--mal)"></div>
      <div style="width:${100-w}%;background:var(--kat)"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:12px">
      <span><i class="sw" style="background:var(--mal)"></i> в бюджет</span>
      <span><i class="sw" style="background:var(--kat)"></i> обратно в портфель</span></div>
    ${fl("Пассивный доход всего",fmt(st.yp)+" ₽")}
    ${fl("Выведено на карту",fmt(st.ywd)+" ₽","var(--mal)")}

function pnlCard(){
  const{L,from,to,skipped}=liveReturns();
  if(!L.length)return `<div class="card"><div class="eyebrow">Поток против переоценки</div>
    <div style="font-size:12px;margin-top:8px;color:var(--muted)">Нужны остатки минимум на две заполненные даты, чтобы посчитать результат.</div></div>`;
  const LL=L.map(x=>{const res=x.v1-x.v0-x.dep;return{n:x.n,inc:x.inc,res,rev:res-x.inc};});
  const mx=Math.max(...LL.map(x=>Math.max(x.inc,Math.abs(x.rev))),1);
  LL.sort((a,b)=>b.res-a.res);
  const tI=LL.reduce((s,x)=>s+x.inc,0),tR=LL.reduce((s,x)=>s+x.rev,0);
  const bar=(inc,rev)=>`<div style="display:flex;align-items:center;height:9px;margin:5px 0">
    <div style="flex:1;display:flex;justify-content:flex-end">
      <div style="width:${Math.abs(Math.min(rev,0))/mx*100}%;height:9px;background:var(--cop)"></div></div>
    <div style="width:1px;height:13px;background:var(--ink)"></div>
    <div style="flex:1;display:flex">
      <div style="width:${Math.max(inc,0)/mx*100}%;height:9px;background:var(--mal)"></div>
      <div style="width:${Math.max(rev,0)/mx*100}%;height:9px;background:var(--kat)"></div></div></div>`;
  let h=`<div class="card"><div class="eyebrow">Поток против переоценки</div>
    <div style="font-size:11px;color:var(--muted);margin:4px 0 14px">из чего сложился результат каждого счёта · ${from}–${to}</div>`;
  LL.forEach(x=>{
    h+=`<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:12px">${esc(x.n)}</span>
        <span class="mono" style="font-size:12px;font-weight:600;color:${x.res>=0?"var(--mal)":"var(--cop)"}">${x.res>=0?"+":"−"}${fmt(Math.abs(x.res))}</span></div>
      ${bar(x.inc,x.rev)}
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted)" class="mono">
        <span>переоценка ${x.rev>=0?"+":"−"}${fmt(Math.abs(x.rev))}</span>
        <span>доход по журналу ${x.inc?"+"+fmt(x.inc):"—"}</span></div></div>`;});
  h+=`<div style="border-top:2px solid var(--ink);padding-top:10px">
    ${fl("Доход по Журналу (купоны/дивиденды)","+ "+fmt(tI)+" ₽","var(--mal)")}
    ${fl("Переоценка бумаг",(tR>=0?"+ ":"− ")+fmt(Math.abs(tR))+" ₽","var(--cop)")}
    ${fl("Итого результат",(tI+tR>=0?"+ ":"− ")+fmt(Math.abs(tI+tR))+" ₽")}</div>
    <div style="font-size:10px;color:var(--muted);margin-top:10px;line-height:1.4">Переоценка = результат минус доход, отмеченный в Журнале операцией «Доход по счёту». Если купоны и дивиденды туда не заносить, они попадут в переоценку — общий итог верный, просто разбивка грубее.${skipped.length?" Без данных: "+skipped.map(([n,r])=>esc(n)+" — "+r).join("; ")+".":""}</div></div>`;
  return h;
}
function retCard(){
  const{L,from,to,skipped}=liveReturns();
  if(!L.length)return `<div class="card"><div class="eyebrow">Доходность по счетам</div>
    <div style="font-size:12px;margin-top:8px;color:var(--muted)">Нужны остатки минимум на две заполненные даты, чтобы посчитать доходность.</div></div>`;
  const LS=L.slice().sort((a,b)=>b.r-a.r);
  const tv0=LS.reduce((s,x)=>s+x.v0,0),tv1=LS.reduce((s,x)=>s+x.v1,0);
  const tdep=LS.reduce((s,x)=>s+x.dep,0),tinc=LS.reduce((s,x)=>s+x.inc,0);
  const tr=(tv1-tv0-tdep)/tv0*100;
  let h=`<div class="card"><div class="eyebrow">Доходность по счетам</div>
    <div style="font-size:11px;color:var(--muted);margin:4px 0 10px">${from}–${to} · считается из остатков и Журнала</div>
    <table class="mono" style="font-size:11px">`;
  LS.forEach(x=>{const c=x.r>0?"var(--mal)":"var(--cop)";
    h+=`<tr style="border-top:1px solid var(--line)">
      <td style="padding:6px 0;font-family:'Inter',system-ui,sans-serif">
        <div style="font-size:12px">${esc(x.n)}</div>
        <div style="font-size:9px;color:var(--muted)">доход по журналу ${fmt(x.inc)} ₽${x.dep?" · внешний поток "+fmt(x.dep):""}</div></td>
      <td style="text-align:right;font-size:10px;color:var(--muted);white-space:nowrap">${fmt(x.v0/1000)}→${fmt(x.v1/1000)}</td>
      <td style="text-align:right;color:${c};font-weight:600;white-space:nowrap">${x.r>0?"+":""}${String(x.r).replace(".",",")}%</td></tr>`});
  h+=`<tr style="border-top:2px solid var(--ink)">
    <td style="padding:7px 0;font-family:'Inter',system-ui,sans-serif;font-weight:600">Всего<div style="font-size:9px;color:var(--muted);font-weight:400">доход по журналу ${fmt(tinc)} ₽</div></td>
    <td style="text-align:right;font-size:10px;color:var(--muted)">${fmt(tv0/1000)}→${fmt(tv1/1000)}</td>
    <td style="text-align:right;font-weight:700;color:${tr>0?"var(--mal)":"var(--cop)"}">${tr>0?"+":""}${tr.toFixed(1).replace(".",",")}%</td></tr></table>
    <div style="font-size:10px;color:var(--muted);margin-top:10px;line-height:1.4">Тыс. ₽. Доходность по Модифицированному Дитцу: изменение стоимости за вычетом внешних пополнений, выводов и переводов из Журнала. Считается автоматически по остаткам счетов — чем аккуратнее ведёте Журнал, тем точнее цифра.${skipped.length?" Без данных: "+skipped.map(([n,r])=>esc(n)+" — "+r).join("; ")+".":""}</div></div>`;
  return h;
}

function split(st){
  const tot=st.ysal+st.ykat||1,n=st.f.length||1;
  const bar=`<div style="display:flex;height:10px;margin-bottom:12px">
    <div style="width:${st.ysal/tot*100}%;background:var(--blue)"></div>
    <div style="width:${st.ykat/tot*100}%;background:var(--kat)"></div></div>`;
  const line=(nm,v,c)=>`<div style="display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-top:1px solid var(--line)">
    <span style="display:flex;align-items:center;gap:6px;font-size:13px"><i class="sw" style="background:${c}"></i>${nm}</span>
    <span style="text-align:right"><span class="mono" style="font-weight:600">${fmt(v)} ₽</span>
    <span class="mono" style="font-size:10px;color:var(--muted);display:block">${fmt(v/n)} / мес · ${Math.round(v/tot*100)}%</span></span></div>`;
  return bar+line("Моя зарплата",st.ysal,"var(--blue)")+line("Партнёр ПИ",st.ykat,"var(--kat)")+
    `<div style="display:flex;justify-content:space-between;border-top:2px solid var(--ink);margin-top:4px;padding-top:7px;font-size:13px;font-weight:600">
      <span>Вместе</span><span class="mono">${fmt(st.ysal+st.ykat)} ₽</span></div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px">Доля в общем доходе — ${Math.round((st.ysal+st.ykat)/(st.ytd||1)*100)}%</div>`;
}
function kpi(l,v,s,c){return`<div class="kpi"><div class="eyebrow" style="font-size:9px">${l}</div>
  <div class="mono" style="font-size:19px;font-weight:600;margin:7px 0 2px;letter-spacing:-.02em;color:${c||"var(--ink)"}">${v}</div>
  <div style="font-size:10px;color:var(--muted)">${s}</div></div>`}
function dl(l,id,v,c){return`<div style="display:flex;justify-content:space-between;padding:3px 0;color:${c||"inherit"}">
  <span style="font-family:'Inter',system-ui,sans-serif;font-size:12px;color:var(--muted)">${l}</span><span id="${id}">${fmt(v)}</span></div>`}

function bind(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{V.tab=b.dataset.tab;render()});
  document.querySelectorAll("button[data-m]").forEach(b=>b.onclick=()=>{V.month=b.dataset.m;render()});
  document.querySelectorAll("tr[data-m]").forEach(b=>b.onclick=()=>{V.month=b.dataset.m;render()});
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{V.date=b.dataset.d;render()});
  const g=document.getElementById("goal");
  if(g)g.onchange=()=>{S.goal=num(g.value);save();render()};
  document.querySelectorAll("input[data-yr]").forEach(i=>{
    i.onfocus=()=>{i.value=String(num(i.value)||"")};
    i.oninput=()=>{const y=i.dataset.yr;S.years[y]=S.years[y]||{};
      S.years[y][i.dataset.fld]=num(i.value);save()};
    i.onblur=()=>{i.value=i.value===""?"":fmt(num(i.value));render()};
  });
  const ya=document.getElementById("yr-add");
  if(ya)ya.onclick=()=>{const ys=Object.keys(S.years).map(Number).filter(x=>x);
    const n=String((ys.length?Math.min(...ys):2026)-1); S.years[n]={}; save(); render();};
  const ja=document.getElementById("j-add"), jk=document.getElementById("j-kind");
  const syncTo=()=>{const r=document.getElementById("j-torow");
    if(r)r.style.display=(jk&&jk.value==="mov")?"flex":"none";};
  if(jk){jk.onchange=syncTo;syncTo();}
  if(ja)ja.onclick=()=>{
    const sum=num(document.getElementById("j-sum").value); if(!sum)return;
    S.ops=S.ops||[];
    S.ops.push({id:String(Date.now()),d:document.getElementById("j-date").value,
      k:jk.value,a:document.getElementById("j-acc").value,
      t:jk.value==="mov"?document.getElementById("j-to").value:"",
      s:sum,n:document.getElementById("j-note").value||""});
    save();render();};
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    S.ops=(S.ops||[]).filter(o=>o.id!==b.dataset.del);save();render();});
  const cpv=document.getElementById("copyprev");
  if(cpv)cpv.onclick=()=>{
    const prev=DATES[DATES.indexOf(V.date)-1]; if(!prev)return;
    S.capital[V.date]=S.capital[V.date]||{};
    ACCOUNTS.forEach(a=>{const v=(S.capital[prev]||{})[a[0]];
      if(v!==undefined&&S.capital[V.date][a[0]]===undefined)S.capital[V.date][a[0]]=v;});
    const pd=S.debts[prev]; if(pd&&!S.debts[V.date])S.debts[V.date]=Object.assign({},pd);
    save();render();};
  const ex=document.getElementById("exp");
  if(ex)ex.onclick=()=>{const w=document.getElementById("expwrap");
    const open=w.style.display==="none";w.style.display=open?"block":"none";
    if(open)document.getElementById("expbox").value=JSON.stringify(Object.assign({},S,{patch:PATCH_V,names:nameMap()}));
    ex.textContent=open?"Скрыть":"Выгрузить / загрузить данные"};
  const pr=document.getElementById("prn");
  if(pr)pr.onclick=()=>window.print();
  const cp=document.getElementById("cpy");
  if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById("expbox").value);
    cp.textContent="Скопировано";setTimeout(()=>cp.textContent="Скопировать",1500);}catch(e){cp.textContent="Не вышло — выделите вручную";}};
  const im=document.getElementById("imp");
  if(im)im.onclick=()=>{
    if(!applyImport(document.getElementById("expbox").value)) impErr("Не похоже на выгрузку — проверьте текст.");};

  const dl=document.getElementById("dl");
  if(dl)dl.onclick=()=>{
    const name="uchet-2026-"+new Date().toISOString().slice(0,10)+".json";
    const blob=new Blob([JSON.stringify(Object.assign({},S,{patch:PATCH_V,names:nameMap()}),null,1)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    dl.textContent="Сохранено: "+name; setTimeout(()=>dl.textContent="Скачать файл",2500);};

  const ul=document.getElementById("ul"), ulinp=document.getElementById("ulinp");
  if(ul&&ulinp){
    ul.onclick=()=>ulinp.click();
    ulinp.onchange=()=>{const f=ulinp.files&&ulinp.files[0]; if(!f)return;
      const r=new FileReader();
      r.onload=()=>{if(!applyImport(r.result))impErr("Файл не читается как выгрузка учёта.");};
      r.onerror=()=>impErr("Не удалось прочитать файл.");
      r.readAsText(f); ulinp.value="";};
  }

  document.querySelectorAll("input[data-f]").forEach(i=>{
    i.onfocus=()=>{i.value=String(num(i.value)||"")};
    i.oninput=()=>{S.income[V.month]=S.income[V.month]||{};
      S.income[V.month][i.dataset.f]=num(i.value);save();updIncome()};
    i.onblur=()=>{i.value=i.value===""?"":fmt(num(i.value))};
  });
  document.querySelectorAll("input[data-iis]").forEach(i=>{
    i.onfocus=()=>{i.value=String(num(i.value)||"")};
    i.oninput=()=>{S.iis=S.iis||{}; S.iis.dep=num(i.value); save()};
    i.onblur=()=>{i.value=i.value===""?"":fmt(num(i.value)); render()};
  });
  document.querySelectorAll("input[data-debt]").forEach(i=>{
    i.onfocus=()=>{i.value=String(num(i.value)||"")};
    i.oninput=()=>{S.debts[V.date]=S.debts[V.date]||{};
      S.debts[V.date][i.dataset.debt]=num(i.value);save();updCap()};
    i.onblur=()=>{i.value=i.value===""?"":fmt(num(i.value))};
  });
  document.querySelectorAll("input[data-goal]").forEach(i=>{
    i.onfocus=()=>{i.value=String(num(i.value)||"")};
    i.oninput=()=>{const v=num(i.value);
      if(v)S.goals[i.dataset.goal]=v; else delete S.goals[i.dataset.goal];
      save();updGoal(i.dataset.goal)};
    i.onblur=()=>{i.value=i.value===""?"":fmt(num(i.value));render()};
  });
  document.querySelectorAll("input[data-acc]").forEach(i=>{
    i.onfocus=()=>{i.value=String(num(i.value)||"")};
    i.oninput=()=>{S.capital[V.date]=S.capital[V.date]||{};
      S.capital[V.date][i.dataset.acc]=num(i.value);save();updCap()};
    i.onblur=()=>{i.value=i.value===""?"":fmt(num(i.value))};
  });
}
function updIncome(){const r=mrow(V.month);
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set("d-p",fmt(r.p));set("d-a",fmt(r.a));set("d-e",fmt(r.e));set("d-t",fmt(r.t)+" ₽");
  const o=S.income[V.month]||{},ex=num(o.exp)+num(o.reno);set("d-s",ex?fmt(r.t-ex)+" ₽":"—");
  const tr=document.querySelector(`tr[data-m="${V.month}"]`);
  if(tr){tr.children[1].textContent=r.p?fmt(r.p):"";tr.children[2].textContent=r.t?fmt(r.t):"—"}}
function updGoal(id){
  const d=stats().now.d,v=num((S.capital[d]||{})[id]),g=num(S.goals[id]);
  const bar=document.getElementById("gb-"+id),txt=document.getElementById("gt-"+id);
  if(!bar||!txt)return;
  const pc=g?Math.min(100,v/g*100):0;
  bar.style.width=pc+"%"; bar.style.background=pc>=100?"var(--mal)":"var(--blue)";
  bar.parentNode.style.display=g?"block":"none";
  txt.textContent=g?`${Math.round(pc)}% · осталось ${fmt(Math.max(0,g-v))} ₽`:"";
}
function updCap(){const e=document.getElementById("c-tot");if(e)e.textContent=fmt(capSum(V.date))+" ₽";
  const ds=debtSum(V.date);
  const dt=document.getElementById("d-tot");if(dt)dt.textContent=ds?"− "+fmt(ds):"—";
  const nt=document.getElementById("net-tot");if(nt)nt.textContent=fmt(capSum(V.date)-ds)+" ₽";
  GROUPS.forEach((g,i)=>{const el=document.getElementById("g-"+i);if(!el)return;
    el.textContent=fmt(ACCOUNTS.filter(a=>a[3]===g).reduce((s,a)=>s+num((S.capital[V.date]||{})[a[0]]),0))})}

load().then(render);
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
